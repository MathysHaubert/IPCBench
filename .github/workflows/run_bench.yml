name: Rust Benchmark
run-name: Github is running our benchmark !! 🚀

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build du projet en Release
        run: cargo build --release --all-features

      - name: Exécuter les benchmarks et mettre à jour le README
        run: |
          cargo run --release --all-features > bench_result.txt

          python3 - <<'EOF'
          import re

          with open("bench_result.txt") as f:
              bench = f.read().strip()

          with open("README.md") as f:
              content = f.read()

          replacement = f"<!-- BENCH_START -->\n```text\n{bench}\n```\n<!-- BENCH_END -->"
          content = re.sub(
              r"<!-- BENCH_START -->.*?<!-- BENCH_END -->",
              replacement,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          EOF

          rm bench_result.txt

      - name: Commit et Push des résultats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: mise à jour des benchmarks [skip ci]"
            git push
          else
            echo "Aucun changement détecté dans les benchmarks."
          fi
